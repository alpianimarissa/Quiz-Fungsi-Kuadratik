<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .nav-btn.active {
            border-color: #2563eb;
            background-color: #eff6ff;
            color: #1d4ed8;
            font-weight: 700;
        }
        .nav-btn.answered {
            background-color: #3b82f6;
            color: white;
            border-color: #2563eb;
        }
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(.disabled) {
            border-color: #3b82f6;
            background-color: #f0f9ff;
        }
        .option-btn.selected {
            border-color: #2563eb;
            background-color: #eff6ff;
        }
        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: #16a34a !important;
            color: #14532d;
            font-weight: 600;
        }
        .option-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: #dc2626 !important;
            color: #7f1d1d;

</head>
<body class="pb-12 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 text-white py-6 px-4 shadow-md">
        <div class="max-w-5xl mx-auto text-center">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Quiz Fungsi Kuadrat SMA/MA</h1>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 mt-6 flex-grow w-full">
        <!-- Status Bar -->
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-center gap-4 sticky top-4 z-30">
            <div class="flex items-center gap-2">
                <span class="text-sm font-medium text-slate-500">Peserta:</span>
                <span class="font-semibold text-slate-800" id="user-name-display">Siswa SMA</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-sm font-medium text-slate-500">Skor Saat Ini:</span>
                <span id="current-score" class="font-bold text-lg text-blue-600">0</span>
            </div>
        </div>

        <!-- Navigation Grid -->
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-6">
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Navigasi Soal (Klik untuk berpindah):</div>
            <div class="grid grid-cols-6 sm:grid-cols-10 md:grid-cols-12 gap-2" id="nav-grid"></div>
        </div>

        <!-- Question Card -->
        <div class="bg-white rounded-xl p-6 sm:p-8 shadow-sm border border-slate-200 mb-6">
            <div class="flex justify-between items-center border-b border-slate-200 pb-4 mb-5">
                <span class="text-lg font-bold text-blue-900" id="q-number">Soal Nomor 1</span>
                <span class="bg-sky-100 text-sky-800 text-xs font-semibold px-3 py-1 rounded-full" id="q-source">UM UGM 2017</span>
            </div>

            <!-- Question Text -->
            <div class="text-slate-800 text-base md:text-lg leading-relaxed mb-6" id="q-text"></div>

            <!-- Question Graphic / SVG Illustration -->
            <div class="flex justify-center items-center my-6" id="q-image"></div>

            <!-- Options List -->
            <div class="flex flex-col gap-3 mb-6" id="options-container"></div>

            <!-- Explanation Box -->
            <div class="hidden border border-emerald-200 bg-emerald-50/60 rounded-xl p-5 mt-6 transition-all" id="explanation-box">
                <div class="font-bold text-emerald-900 flex items-center gap-2 mb-3 text-base">
                    <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>

                </div>
                <div class="text-slate-700 text-sm md:text-base leading-relaxed space-y-2" id="explanation-text"></div>
            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="flex flex-col sm:flex-row justify-between gap-3 mb-8">
            <button class="px-5 py-2.5 rounded-lg font-semibold bg-slate-600 text-white hover:bg-slate-700 transition disabled:opacity-50" id="btn-prev" onclick="prevQuestion()">&larr; Sebelumnya</button>
            <button class="px-5 py-2.5 rounded-lg font-semibold bg-rose-600 text-white hover:bg-rose-700 transition" onclick="confirmReset()">Ulangi Tes</button>
            <button class="px-5 py-2.5 rounded-lg font-semibold bg-blue-600 text-white hover:bg-blue-700 transition" id="btn-next" onclick="nextQuestion()">Selanjutnya &rarr;</button>
        </div>
    </main>

    <!-- Modal Hasil -->
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden justify-center items-center z-50 p-4" id="result-modal">
        <div class="bg-white rounded-2xl p-6 md:p-8 max-w-md w-full text-center shadow-2xl border border-slate-100">
            <h2 class="text-xl font-bold text-slate-800 mb-2">Hasil Evaluasi Quiz</h2>
            <p class="text-slate-500 text-sm">Nilai Akhir Anda:</p>
            <div class="text-5xl font-extrabold text-blue-600 my-4" id="final-score">0</div>
            <p class="text-sm font-medium text-slate-600 mb-6" id="score-status">Tetap Semangat!</p>
            <div class="grid grid-cols-3 gap-3 my-4">
                <div class="p-3 rounded-lg bg-emerald-50 border border-emerald-100"><span class="text-xs text-emerald-600 font-semibold">Benar</span><br><span class="text-xl font-bold text-emerald-700" id="count-correct">0</span></div>
                <div class="p-3 rounded-lg bg-rose-50 border border-rose-100"><span class="text-xs text-rose-600 font-semibold">Salah</span><br><span class="text-xl font-bold text-rose-700" id="count-wrong">0</span></div>

            </div>
            <button class="w-full mt-4 py-3 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition" onclick="closeModal()">Lihat Pembahasan / Lanjutkan</button>
        </div>
    </div>

                correct: 0,

                options: ["Benar, Benar, Benar", "Benar, Salah, Benar", "Salah, Benar, Salah", "Benar, Salah, Salah", "Salah, Salah, Benar"],

        let currentIndex = 0;
        let userAnswers = {};

        window.onload = function() {
            loadSavedState();
            renderNavGrid();
            loadQuestion(currentIndex);
        };

        function loadSavedState() {
            const savedAnswers = localStorage.getItem('defantri_quiz_answers');
            if (savedAnswers) userAnswers = JSON.parse(savedAnswers);
        }

        function saveState() {
            localStorage.setItem('defantri_quiz_answers', JSON.stringify(userAnswers));
        }

        function renderNavGrid() {
            const navGrid = document.getElementById('nav-grid');
            navGrid.innerHTML = '';
            questionsData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn h-10 border border-slate-200 bg-slate-100 text-slate-700 rounded-lg font-semibold text-xs hover:bg-slate-200 transition';
                btn.id = `nav-btn-${idx}`;
                btn.innerText = idx + 1;
                
                if (userAnswers.hasOwnProperty(idx)) {
                    btn.classList.add('answered');
                }
                if (idx === currentIndex) {
                    btn.classList.add('active');
                }

                btn.onclick = () => jumpToQuestion(idx);
                navGrid.appendChild(btn);
            });
            updateScoreDisplay();
        }

        function loadQuestion(index) {
            currentIndex = index;
            const q = questionsData[index];

            document.getElementById('q-number').innerText = `Soal Nomor ${q.id} / 38`;
            document.getElementById('q-source').innerText = q.source;
            
            // Render text with Markdown Bold support & KaTeX
            document.getElementById('q-text').innerHTML = formatText(q.text);

            // Graphic / SVG
            const imgContainer = document.getElementById('q-image');
            imgContainer.innerHTML = q.svg ? q.svg : '';

            // Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const prefixes = ['A', 'B', 'C', 'D', 'E'];
            q.options.forEach((optText, optIdx) => {
                const optBtn = document.createElement('div');
                optBtn.className = 'option-btn border border-slate-200 rounded-xl p-3 sm:p-4 flex items-center cursor-pointer bg-white';
                
                const isSelected = userAnswers[index] === optIdx;
                const isAnswered = userAnswers.hasOwnProperty(index);

                if (isAnswered) {
                    optBtn.classList.add('disabled');
                    if (optIdx === q.correct) {
                        optBtn.classList.add('correct');
                    } else if (isSelected && optIdx !== q.correct) {
                        optBtn.classList.add('wrong');
                    }
                } else if (isSelected) {
                    optBtn.classList.add('selected');
                }

                optBtn.innerHTML = `
                    <span class="font-bold text-slate-500 w-8 flex-shrink-0">(${prefixes[optIdx]})</span>
                    <span class="text-slate-800 text-base flex-grow">${formatText(optText)}</span>
                `;

                optBtn.onclick = () => {
                    if (!isAnswered) {
                        selectOption(index, optIdx);
                    }
                };

                optionsContainer.appendChild(optBtn);
            });

            // Explanation Box
            const expBox = document.getElementById('explanation-box');
            if (userAnswers.hasOwnProperty(index)) {
                document.getElementById('explanation-text').innerHTML = formatText(q.explanation);
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }

            // Navigation status
            document.querySelectorAll('.nav-btn').forEach((b, i) => {
                b.classList.toggle('active', i === index);
            });

            // Trigger KaTeX rendering on the card
            renderKaTeX();

            document.getElementById('btn-prev').disabled = index === 0;
            document.getElementById('btn-next').innerText = index === questionsData.length - 1 ? 'Selesai & Evaluasi' : 'Selanjutnya \u2192';
        }

        function formatText(str) {
            if (!str) return '';
            // Convert markdown **text** to <strong>text</strong>
            return str.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }

        function renderKaTeX() {
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError: false
                });
            }
        }

        function selectOption(qIdx, optIdx) {
            userAnswers[qIdx] = optIdx;
            saveState();
            renderNavGrid();
            loadQuestion(qIdx);
        }

        function jumpToQuestion(idx) {
            loadQuestion(idx);
        }

        function nextQuestion() {
            if (currentIndex < questionsData.length - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                showResultsModal();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                loadQuestion(currentIndex - 1);
            }
        }

        function updateScoreDisplay() {
            let score = 0;
            Object.keys(userAnswers).forEach(qIdx => {
                if (userAnswers[qIdx] === questionsData[qIdx].correct) {
                    score += 4;
                } else {
                    score -= 1;
                }
            });
            document.getElementById('current-score').innerText = score;
        }

        function showResultsModal() {
            let correctCount = 0;
            let wrongCount = 0;
            let emptyCount = 0;

            questionsData.forEach((q, idx) => {
                if (userAnswers.hasOwnProperty(idx)) {
                    if (userAnswers[idx] === q.correct) correctCount++;
                    else wrongCount++;
                } else {
                    emptyCount++;
                }
            });

            const totalScore = (correctCount * 4) - (wrongCount * 1);

            document.getElementById('final-score').innerText = totalScore;
            document.getElementById('count-correct').innerText = correctCount;
            document.getElementById('count-wrong').innerText = wrongCount;
            document.getElementById('count-empty').innerText = emptyCount;

            const modal = document.getElementById('result-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('result-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function confirmReset() {
            if (confirm("Apakah Anda yakin ingin mengulang tes dari awal? Semua jawaban akan dihapus.")) {
                localStorage.removeItem('defantri_quiz_answers');
                localStorage.removeItem('defantri_quiz_time');
                userAnswers = {};
                renderNavGrid();
                loadQuestion(0);
            }
        }
    </script>
</body>
